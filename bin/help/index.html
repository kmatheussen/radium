<script>

  function showHide(name) {
    var x = document.getElementById(name);
    if (x.style.display === 'none') {
        x.style.display = 'block';
    } else {
        x.style.display = 'none';
    }
}

function showHide2(divname,linkname) {
    var x = document.getElementById(divname);
    if (x.style.display === 'none') {
        x.style.display = 'block';
        document.getElementById(linkname).innerHTML="Hide";
    } else {
        x.style.display = 'none';
        document.getElementById(linkname).innerHTML="Show";
    }
}

const instrument_routing_text = `
<h2>Routing</h2>

<p><small><i>This manual page was written by an AI.</i></small></p>

The routing instruments are used to route and transform audio signals between instruments. They are found in the <b>"Routing"</b> section of the "<b>From instrument/effect-menu...</b>" popup menu (used e.g. when creating a new instrument, inserting a plugin, or assigning an instrument to a track).

<p>

The routing section is divided into the following groups: <b>Buses</b>, <b>In/Out</b>, <b>Send/Receive</b>, and <b>Patchbays</b>.

<h3>Buses (Pipe and Pipe8)</h3>

<UL>
  <LI><b>Pipe</b>: A stereo (2-channel) audio bus. Sends the sound through unmodified.
  <LI><b>Pipe8</b>: An 8-channel audio bus. Sends the sound through unmodified.
</UL>

Every instrument outputs to a set of <b>system buses</b> (Pipe objects), which are used to collect the output of all instruments before it is sent to the main output. A Pipe has no controls; it just passes the audio through.

<p>

<h3>In/Out</h3>

These objects connect to the soundcard, or to Jack ports:

<UL>
  <LI><b>Jack Stereo In</b>: Receives a stereo sound from an external Jack port (or the soundcard). Has no audio inputs; it is a source.
  <LI><b>Jack Stereo Out</b>: Sends a stereo sound to an external Jack port (or the soundcard). Has no audio outputs; it is a sink.
  <LI><b>Jack 8ch In</b>: Same as Jack Stereo In, but with 8 channels.
  <LI><b>Jack 8ch Out</b>: Same as Jack Stereo Out, but with 8 channels.
  <LI><b>System In</b>: The system input (2 channels). Usually connected to the main soundcard input.
  <LI><b>System In 8</b>: The system input with 8 channels.
  <LI><b>System Out</b>: The system output (2 channels). Connected to the system volume control in the bottom bar.
  <LI><b>System Out 8</b>: The system output with 8 channels.
</UL>

<p>

When Jack is running, the "Jack Stereo/8ch" objects connect to Jack ports that can be wired up in an external patchbay. The <b>System In</b> and <b>System Out</b> objects are always available, and are used to get audio into and out of Radium when not using Jack.

<p>

<h3>Send/Receive</h3>

<UL>
  <LI><b>Send</b>: Sends stereo audio to all <b>Receive</b> objects with the same name.
  <LI><b>Send8</b>: Same as Send, but with 8 channels.
  <LI><b>Receive</b>: Receives stereo audio from a <b>Send</b> object with the same name.
  <LI><b>Receive8</b>: Same as Receive, but with 8 channels.
</UL>

Send and Send8 send audio to all Receive and Receive8 objects with the same name. Audio is delayed by one Radium buffer, so this is not the same as using an audio connection. The main purpose of Send/Receive is to create recursive audio graphs.

<p>

<h3>Patchbays</h3>

A patchbay sends any input channel to any output channel. The following sizes are available:

<UL>
  <LI><b>Patchbay 8x8</b>
  <LI><b>Patchbay 16x16</b>
  <LI><b>Patchbay 24x24</b>
  <LI><b>Patchbay 32x32</b>
</UL>

Each possible input-to-output route is a checkbox effect named "<b>from->to</b>". For example, <b>Patchbay 8x8</b> has 64 checkbox effects (8 inputs x 8 outputs). This is useful e.g. for sidechain compression, where you want to send a separate signal (like a kick drum) to the sidechain input of a compressor.
`;

     name : "routing",
     menu : "instrument",

<a name="what"></a><h3>What is timing?</h3>

Timing is tempo and rhythm.

<p>

<a name="usage"></a><h3>What is timing used for in Radium?</h3>

<OL>

        <p>

        <p>

</OL>
<pre>
</pre>
<p>


<a name="overview"></a><h3>How is timing controlled?</h3>

Timing is controlled by tempo events and signature events:
<UL>
<LI> <b>Tempos</b> (BPM) specify the duration of a quarter note. Note that BPM stands for <b>B</b>eats <b>P</b>er <b>M</b>inute, which is a misleading name unless your signature is 4/4. <b>QPM</b> (Quarter notes Per Minute) would be more correct.
<p>
<LI> <b>Signatures</b> specify rhythm. It does so by specifying number of beats (in a bar) above beat type.
  For instance, a 4/4 signature means that there are 4 beats in the bar, and that each beat is a quarter.
  <p>
    Here are some other common names for the term "signature": time signature, meter signature, meter, metre, measure, and measure signature.
</UL>
<p>
Example 1: If tempo is set to 64 BPM, and the signature is set to 8/8, a new bar will be played every 16 seconds (64/4 * 8/8), and a new beat will be played every 2 seconds (64/4 * 1/8).
Example 2: If the signature is set to 2/4, a new bar will be played every 8 seconds (64/4 * 2/4), and a new beat will be played every 4 seconds (64/4 * 1/4).
<pre>
</pre>
<p>



<a name="modes"></a><h3>Timing modes</h3>

There are two timing modes to select from. Only one of them can be enabled at the same time:

Editor timing is the default mode. In editor timing mode, tempos and signaturs are provided by the editor blocks placed in the <b>first seqtrack</b>.
<p>
Tempos are edited in the tempo tracks in the editor ("BPM"), and signatures are edited in the signature tracks in the editor ("Sign."):
<p>
  <img src="editortiming.png">
<p> 
In this mode, the tempo and signature lanes in the sequencer are just used for visualization, and editing in any of these two lanes is disabled.
<p>
 
<LI><b>Sequencer timing</b><br>
<p>
In sequencer timing mode, tempos and signatures are provided by the tempo and signature lanes in the sequencer.
This mode can be set explicitly in the popup menu of the sequencer,
but it will also be used automatically if the first seqtrack is for audio and not for editor blocks
<p>
If you are using Radium mainly for recording and playing back audio files,
this mode is both simpler, and probably easier to use, than editor timing.
<p>
Note that accelerando and ritardando are not supported yet in this mode.
In addition, signatures must align with bars, and tempos must align with beats.
Editor timing mode does not have these limitations.
<p>

</OL>

<a name="defaulttimingvalues"></a><h3>Default Timing values</h3>
<p>

<p>

const modulators_text = `
<h2>Modulators (LFO, etc.)</h2>

<p><small><i>This manual page was written by an AI.</i></small></p>

Any effect parameter, both Audio and MIDI, can be controlled by a modulator.

<p>

A modulator constantly changes the value of the effect, usually in a cyclic manner (LFO). Modulators are often used to create vibrato, tremolo, and so forth.

<p>

<IMG SRC="modulator_instrument.png" ALT="Modulator instrument" style="border:10px solid transparent" align="right" width="60%">

<h3>How to</h3>

<OL>
  <LI><b>Right-click</b> an effect (slider or checkbox) in the instrument widget.
  <LI>Select "<a href="index.html?page=effect_popup_menu">Assign Modulator</a>".
  <LI>A modulator is created, and its instrument widget is shown, where you change the <b>shape</b> and <b>frequency</b> of the modulator.
</OL>

<p>

<h3>Modulator types (the "Type" effect)</h3>

Each modulator has a <b>"Type"</b> effect which selects what kind of signal the modulator generates. The available types are:

<table>
  <tr><th>Type</th><th>Description</th></tr>
  <tr>
    <td><b>Sine (LFO)</b></td>
    <td>A smooth sinusoidal (LFO) wave. Good for vibrato and tremolo.</td>
  </tr>
  <tr>
    <td><b>Triangle (LFO)</b></td>
    <td>A triangle wave. Smooth, but changes direction abruptly at the peaks.</td>
  </tr>
  <tr>
    <td><b>Square (LFO)</b></td>
    <td>A square wave, jumping between the minimum and maximum value.</td>
  </tr>
  <tr>
    <td><b>Saw (LFO)</b></td>
    <td>A sawtooth wave, ramping up and then dropping abruptly back down.</td>
  </tr>
  <tr>
    <td><b>Inverted Saw (LFO)</b></td>
    <td>An inverted sawtooth wave, ramping down and then jumping abruptly back up.</td>
  </tr>
  <tr>
    <td><b>Random</b></td>
    <td>Outputs a new random value each cycle. The value stays constant within a cycle.</td>
  </tr>
  <tr>
    <td><b>Manual Parameter Input</b></td>
    <td>Does not generate a signal itself. Instead, the modulation value is the value of the <b>Manual input</b> effect, which can be moved manually, automated, or MIDI-learned. This is convenient to MIDI-learn on if using 3rd party modulators.</td>
  </tr>
  <tr>
    <td><b>Audio Input (no envelope follower, no filtering)</b></td>
    <td>The modulation value follows the audio coming into the modulator's audio input directly. No envelope follower or filtering is applied.</td>
  </tr>
  <tr>
    <td><b>Audio Input Envelope Follower</b></td>
    <td>The modulation value follows the amplitude (envelope) of the audio coming into the modulator's audio input. The <b>Attack</b> and <b>Release</b> effects control how fast the envelope follower reacts to louder and quieter input, respectively.</td>
  </tr>
</table>

<p>

The oscillator types (Sine, Triangle, Square, Saw, and Inverted Saw) are all synced to the tempo while playing. Their frequency is set with the <b>Tempo multiplier</b> and <b>Tempo divisor</b> effects (the frequency is the BPM multiplied by the tempo multiplier, divided by the tempo divisor). When not playing, the <b>Phase shift</b> effect can be used to set the phase of the oscillator.

<p>

<h3>Modulator instruments</h3>

<UL>
  <LI>A modulator has its own instrument widget, just like other instruments. Use it to change the modulator's shape (e.g. sine, square, saw) and frequency.
  <LI>Several modulators can be assigned to the same effect, and they are summed together.
  <LI>Modulators can also be created from <b>Windows -> Show Instrument list</b> (or by the <b>Create new instrument</b> popup menu) and then connected to an effect.
</UL>

function getQueryVariable(variable) {
    var query = window.location.search.substring(1);
    var vars = query.split('&');
    for (var i = 0; i < vars.length; i++) {
        var pair = vars[i].split('=');
        if (decodeURIComponent(pair[0]) == variable) {
            return decodeURIComponent(pair[1]);
        }
    }
    console.log('Query variable %s not found', variable);
    return "gui";
}

function get_strings_from_html(html) {
    var ret = [];
    var curr = "";

    function pushit() {
        if (curr != ""){
            ret.push(curr.trim().replace("\n", "<br>"));
            curr = "";
        }
    }

    function rec(element) {
        /*
        console.log("gakk");
        console.log(element.tagName);
        console.log(element.nodeType);
        console.log(element.data)
        */
        const is_terminating = g_terminating_search_tags.has(element.tagName);
        
        if (is_terminating)
            pushit();

        if (element.tagName=="BR")
            curr += "<br>";

        if (element.nodeType==3) {
            /*
            element.data.trim().split(/(\s+)/).forEach(function (str) {
                str = str.trim();
                if (str != "")
                    ret.push(str);
            });
            */
            const text = element.data; //.trim();
            //console.log(text);
            if (text != "") {
                if (curr=="") {
                    curr = text;
                } else {
                    curr += text;
                }
            }
        } else {
            /*
            console.log("child nodes2:");
            console.log(element.childNodes);
            */
            for(var i=0;i<element.childNodes.length;i++)
                rec(element.childNodes[i]);
        }

        
        if (is_terminating)
            curr += "\n";
    }
    
    rec(htmlToElement(html));
    pushit();
    //console.log(ret);
    return ret;
}

function get_search_result_clip_fuse(text, matches, search_string_length) {
    var ret = "";

    for(var i = search_string_length ; i > 0 ; i--) {
        var last_n = 0;
        var success = false;
        matches.forEach(function (match, index){
            match.indices.forEach(function (startend) {
                const start = startend[0];
                const end = startend[1];
                if ((end-start)+1 >= i) {
                    ret += text.substring(last_n, start) + '<font color="red">' + text.substring(start, end+1) + '</font>'
                    last_n = end+1;
                    success = true;
                }
            });
        });
        if (success)
            break;
    }

    ret +=  text.substring(last_n, text.length);
    return ret;
}
